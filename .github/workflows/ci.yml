name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 单测全部离线: 不需要数据库、不需要 API Key。
      # 打了 @Tag("live") 的用例默认被 surefire.excludedGroups 排除, 因此 0 跳过。
      - name: Build and test
        run: mvn -B clean test

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-domain
          path: domain/target/site/jacoco/
          if-no-files-found: ignore
