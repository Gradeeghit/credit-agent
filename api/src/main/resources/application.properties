spring.application.name=credit-agent
server.port=8080

# PostgreSQL 16 + pgvector
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/credit_agent}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring AI (OpenAI 兼容接口: DeepSeek / 通义)
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-xxx}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.deepseek.com}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:deepseek-chat}
spring.ai.openai.embedding.options.model=${EMBEDDING_MODEL:text-embedding-3-small}

# MyBatis-Plus
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto