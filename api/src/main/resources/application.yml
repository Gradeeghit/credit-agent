# 信贷申请智能审批助手 - 主配置
# 由 application.properties 等价迁移, 键名与取值保持不变
spring:
  application:
    name: credit-agent

  # PostgreSQL 16 + pgvector
  datasource:
    url: '${DB_URL:jdbc:postgresql://192.168.56.10:5432/123456}'
    username: '${DB_USERNAME:postgres}'
    password: '${DB_PASSWORD:postgres}'
    driver-class-name: org.postgresql.Driver

  # Spring AI (OpenAI 兼容接口: DeepSeek / 通义)
  # 注意1: embedding 不复用这组连接参数(不同 base_url / 不同 Key), 见下方 credit-agent.ai.embedding
  # 注意2: base-url 绝对不能带 /v1。Spring AI 内部固定拼 /v1/chat/completions 与 /v1/embeddings,
  #        写成 .../compatible-mode/v1 会变成 .../compatible-mode/v1/v1/... 直接 404
  ai:
    openai:
      api-key: '${OPENAI_API_KEY:sk-xxx}'
      base-url: '${OPENAI_BASE_URL:https://ws-7ave3oec1mw2bccl.cn-beijing.maas.aliyuncs.com/compatible-mode}'
      chat:
        options:
          model: '${OPENAI_MODEL:deepseek-v4.1-flash-1017}'

  # 政策文档上传(A2 口径: 单文件 10MB); 容器上限放大一档, 超限由业务校验返回结构化 413
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 24MB

server:
  port: 8081

# 上传落盘目录(政策文档/材料 PDF)
credit-agent:
  upload-dir: '${UPLOAD_DIR:uploads}'
  security:
    # 开发阶段身份由前端直传 X-User-Id / X-User-Role, 尚未接入 Spring Security(I2/I3)
    # true  = 缺少身份头直接 401(默认, 安全优先)
    # false = 降级为匿名身份(无任何权限), 仅供本地联调临时使用
    identity-required: ${IDENTITY_REQUIRED:true}
  ai:
    # H3 成本: 模型单价(元/千 token); 留空则 ai_call_log.cost 为 NULL(不瞎估)
    # 口径属 PRD §12 待确认项, 确定后填这里或设环境变量
    price:
      prompt-per-k: '${AI_PRICE_PROMPT_PER_K:1}'
      completion-per-k: '${AI_PRICE_COMPLETION_PER_K:2}'
    # B5 向量化: 独立于 chat 的连接参数, 由 EmbeddingModelConfig 单独构造 Bean
    embedding:
      # 总开关: false 时切片只落库不向量化, 检索退化为纯 BM25
      enabled: ${EMBEDDING_ENABLED:true}
      api-key: '${OPENAI_API_KEY:sk-yyy}'
      # 同样不能带 /v1; 带上了 EmbeddingModelConfig 会自动剥掉并打警告
      base-url: '${EMBEDDING_BASE_URL:https://ws-7ave3oec1mw2bccl.cn-beijing.maas.aliyuncs.com/compatible-mode}'
      model: '${EMBEDDING_MODEL:qwen3.7-text-embedding-flash}'
      # 必须与 document_chunk.embedding 的 vector(1024) 一致, 写库前会断言
      dimensions: ${EMBEDDING_DIMENSIONS:1024}
      # 百炼单批上限 20 行, 超过会被服务端拒绝
      batch-size: ${EMBEDDING_BATCH_SIZE:20}

# MyBatis-Plus
mybatis-plus:
  configuration:
    # 下划线列名自动映射驼峰属性, 如 id_card_no -> idCardNo
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略为数据库自增(BIGSERIAL), 与 9 张表 DDL 一致
      id-type: auto

# 日志: MyBatis 打印 SQL 用的 logger 名是 Mapper 接口的全限定名
# (如 com.credit.agent.infra.persistence.mapper.ProductMapper.insert),
# 所以必须按 mapper 包开 debug; 配 org.apache.ibatis.mapping.SqlSource 是无效的(它只是个接口类)
logging:
  pattern:
    # H1: 每行日志带 traceId(MDC), 便于 grep 一条链路
    level: "%5p [%X{traceId:-}]"
  level:
    com.credit.agent.infra.persistence.mapper: debug
    # ---- Spring AI 模型请求/响应日志 ----
    # SimpleLoggerAdvisor 与 DefaultToolCallingManager 内部都只调 logger.debug(...),
    # root 为 INFO 时加 advisor 也不会输出任何内容。
    # 默认 info(静默): prompt 里含客户姓名/证件号/流水明细, 属敏感数据, 不默认开。
    # 联调时临时打开: 设环境变量 AI_LOG_LEVEL=debug
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: '${AI_LOG_LEVEL:debug}'
    org.springframework.ai.model.tool.DefaultToolCallingManager: '${AI_LOG_LEVEL:debug}'



